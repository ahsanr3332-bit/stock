<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burgerology Stock Book</title>
<style>
:root{--bk:#000;--panel:#161412;--line:#3a3220;--ye:#ffc400;--ye2:#ffe27a;--tx:#f3ecd8;--mut:#a89f86;--red:#ff6a5c;--grn:#8ddf6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bk);color:var(--tx);font:15px/1.5 Georgia,'Times New Roman',serif}
header{background:var(--ye);color:#000;padding:16px 24px;border-bottom:6px double #000;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:26px;letter-spacing:.5px}
header small{font-style:italic;font-size:17px}
.brand{display:flex;align-items:center;gap:14px}
#lg{height:68px;width:auto;object-fit:contain}
@media print{body{background:#fff;color:#000}header,.card{border-color:#000}nav,.bar,button,#toast,.hint,.alert{display:none!important}.card{background:#fff;border:0}th{background:#ddd!important;color:#000}td{color:#000!important;border-color:#999}h2{color:#000}}
nav{display:flex;gap:0;background:#000;border-bottom:2px solid var(--ye);padding:0 16px;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);padding:12px 20px;font:inherit;font-size:16px;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap}
nav button.on{color:var(--ye);border-bottom-color:var(--ye);font-weight:bold}
main{max-width:1150px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ye);padding:16px;margin-bottom:18px}
.bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ye2)}
input,select{background:#000;color:var(--tx);border:1px solid #6b5a22;padding:9px 10px;font:inherit;font-size:15px;border-radius:3px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ye);outline-offset:1px}
td input{width:96px;text-align:right}
button.b{background:var(--ye);color:#000;border:0;padding:10px 20px;font:inherit;font-weight:bold;cursor:pointer;border-radius:3px}
button.b:hover{background:var(--ye2)}
button.g{background:none;color:var(--ye);border:1px solid var(--ye);padding:8px 14px;font:inherit;cursor:pointer;border-radius:3px}
button.g:hover{background:#2a2200}
button.x{color:var(--red);border-color:var(--red)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:var(--ye);color:#000;text-align:right;padding:9px 10px;font-size:14px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr.t td{border-top:2px solid var(--ye);font-weight:bold;color:var(--ye)}
.u{color:var(--ye2)}.lo{color:var(--red);font-weight:bold}.ok{color:var(--grn)}
.alert{background:#2b0f0c;border:1px solid var(--red);border-left:5px solid var(--red);padding:12px 16px;margin-bottom:18px}
.empty{color:var(--mut);text-align:center;padding:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:8px;background:#000;border:1px solid var(--ye);padding:5px 6px 5px 14px;border-radius:20px}.chip button{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer;line-height:1;padding:0 6px}
#auth{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}#auth[hidden]{display:none}
#auth form{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ye);padding:26px;width:min(360px,92vw);display:flex;flex-direction:column;gap:12px}
#auth h1{color:var(--ye);margin:0}#auth img{height:96px;align-self:center}
.nb{margin-left:auto;color:var(--ye)!important;border:1px solid var(--ye)!important;border-radius:3px;align-self:center;padding:7px 14px!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ye);color:#000;padding:11px 22px;font-weight:bold;border-radius:3px;display:none}
h2{margin:0 0 12px;color:var(--ye);font-size:19px}
.hint{color:var(--mut);font-size:13px;margin:8px 0 0}

/* ---- DAILY SALES REPORT (one A4 page) ---- */
#rpt{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-weight:800;width:190mm;margin:0 auto;border:0}
#rpt .hd{display:grid;grid-template-columns:1fr 1fr;border:0;height:18mm;position:relative}#rpt .hd>div:first-child{white-space:nowrap;font-size:12px;padding:0 2mm}
#rpt .hd>div{display:flex;align-items:center;padding:0 3mm;font-size:13px}#rpt .hd .ttl{justify-content:center;font-size:28px;letter-spacing:2px;border:0;position:absolute;left:30%;width:40%;top:0;bottom:0;padding:0}
#rpt .hd .lg{justify-content:flex-end;grid-column:2;padding-right:10mm}#rpt .hd img{height:14mm}
#rpt .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:2.5px solid #000}#rpt .cols>div{min-width:0}#rpt .cols>div:first-child{border-right:2.5px solid #000}
#rpt table{border-collapse:collapse;width:100%;min-width:0;table-layout:fixed}
#rpt td,#rpt th{border:1.5px solid #000;height:7.5mm;padding:0 1.6mm;font-size:13px;font-weight:800;overflow:hidden;white-space:nowrap;text-align:left}
#rpt tr:first-child td,#rpt tr:first-child th{border-top:0}#rpt td:first-child,#rpt th:first-child{border-left:0}#rpt td:last-child,#rpt th:last-child{border-right:0}
#rpt th{background:#000;color:#ffc400}
#rpt input{width:100%;border:0;background:transparent;font:inherit;color:#000;padding:0;outline:0;text-align:left}
#rpt input:focus{background:#fff3b0;color:#000!important}#rpt input.lbi{color:inherit}#rpt .ttl input{text-align:center}
#rpt .lb{background:#ececec}#rpt .st td{background:#f4f4f4}#rpt .mj td{background:#ffe27a;font-size:14px}
#rpt .neg{color:#c00}
@page{size:A4 portrait;margin:8mm}
@media print{body.sp header,body.sp nav,body.sp .bar,body.sp #toast,body.sp #auth,body.sp .hint{display:none!important}
body.sp{background:#fff}body.sp main{padding:0!important;margin:0!important}body.sp .card{border:0;padding:0;background:#fff}
body.sp #rpt{width:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-inside:avoid;break-inside:avoid}
body.sp #ssum{display:none!important}body.sp .rw{overflow:visible!important}#rpt th{background:#000!important;color:#ffc400!important}#rpt td{color:#000!important;border-color:#000!important}body.sp #rpt .neg{color:#000!important}body.sp #rpt input:focus{background:transparent}}
</style></head><body>
<header style="padding-top:8px;padding-bottom:8px"><div class="brand"><img id="lg" alt="Burgerology logo" hidden><h1>Burgerology</h1></div><small>Stock Book<span id="who"></span><span id="syn"></span></small></header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="auth" hidden></div>
<div id="toast"></div>
<script id="seed" type="application/json"></script>
<script>
const TEMPLATE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const API='https://script.google.com/macros/s/AKfycbzDHNaBIIgM5ihXlbBRnCVjiEk4fN1HruLEJDDraty0HAdMiUqlvYN5K8YSHRVyLRKgOg/exec';
let K='bgy_v2_',BR='',TOK='',ENTERED=0;
let DB={products:[],entries:[]};
DB.sales=DB.sales||{};DB.slabels=DB.slabels||{};DB.users=DB.users||[];DB.sections=DB.sections&&DB.sections.length?DB.sections:['Raw','Bonton','Horof'];DB.locations=DB.locations&&DB.locations.length?DB.locations:['Front','Kitchen'];DB.products.forEach(p=>{p.dept=p.dept||'Kitchen';p.section=p.section||DB.sections[0]});
const persist=()=>{DB.savedAt=Date.now();try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Could not save in this browser')}if(DB.syncUrl&&!SYN)persistLater()};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const f=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const act=()=>DB.products.filter(p=>p.on!==false);
const num=v=>v===''||v==null?NaN:parseFloat(v);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
function lastE(pid,before){let r=null;for(const e of DB.entries)if(e.pid==pid&&(!before||e.date<before)&&(!r||e.date>r.date))r=e;return r}

let tab='daily',D=ymd(new Date()),RT='daily',RD=ymd(new Date()),RE=ymd(new Date());
let FL='all',FS='all';
let FQ='daily';
const isStoreBr=()=>/bashundhara|basundhara|bashundara/i.test(BR);
const freqOpts=()=>isStoreBr()?['weekly','daily','store']:['weekly','daily'];
const pfq=p=>p.freq||'weekly';
const ok=p=>(FL=='all'||p.dept==FL)&&(FS=='all'||p.section==FS)&&(FQ=='all'||pfq(p)==FQ);
function filt(cb){return `<label>Location<select onchange="FL=this.value;${cb}()"><option value="all">All</option>${DB.locations.map(x=>`<option ${FL==x?'selected':''}>${x}</option>`).join('')}</select></label><label>Section<select onchange="FS=this.value;${cb}()"><option value="all">All</option>${DB.sections.map(x=>`<option ${FS==x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function sel(id,k,opts,cur){if(!opts.includes(cur))opts=[...opts,cur];return `<td><select onchange="upd('${id}','${k}',this.value)">${opts.map(o=>`<option ${o==cur?'selected':''}>${esc(o)}</option>`).join('')}</select></td>`}
const TABS=[['daily','Daily Stock'],['weekly','Weekly Stock'],['store','Store'],['report','Reports'],['sales','Daily Sales'],['products','Products'],['settings','Settings'],['all','All Branches']];
function go(t){tab=t;if(t=='daily')FQ='daily';else if(t=='weekly')FQ='weekly';else if(t=='store')FQ='store';$('#nav').innerHTML=TABS.filter(x=>x[0]=='all'?isTop():x[0]=='store'?isStoreBr():(isAdmin()||x[0]=='daily'||x[0]=='weekly'||x[0]=='report'||x[0]=='sales')).map(([k,n])=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${n}</button>`).join('');({daily,weekly:daily,store:daily,report,sales,products,settings,all:allView})[t]();window.scrollTo(0,0)}

function lowList(){return act().filter(p=>{const e=lastE(p.id);const q=e?e.close:p.init;return p.min>0&&q<=p.min}).map(p=>{const e=lastE(p.id);return{p,q:e?e.close:p.init}})}
function lowBox(){return lowBox0()+(false&&(!DB.lastBackup||Date.now()-DB.lastBackup>6048e5)?`<div class="card" style="padding:10px 16px"><b>Backup reminder:</b> download a backup file from Settings and keep a copy somewhere safe (pen drive or Google Drive).</div>`:'')}
function lowBox0(){const l=lowList();return l.length?`<div class="alert"><b>Low stock:</b> ${l.map(x=>`${esc(x.p.name)} (${f(x.q)} ${esc(x.p.unit)} left)`).join(', ')}</div>`:''}

/* ---------- DAILY ---------- */
function daily(){
 const ps=act().filter(ok);
 let h=lowBox()+`<div class="card"><h2>${FQ=='weekly'?'Weekly Stock (count once a week)':FQ=='store'?'Store Stock (Bashundhara)':'Daily Stock'}</h2><div class="bar"><label>${FQ=='weekly'?'Stock count date':'Date'}<input type="date" id="dd" value="${D}" onchange="D=this.value;daily()"></label>${filt('daily')}
 <button class="b" onclick="saveDay()">Save this day</button><button class="g" onclick="exportReport('daily',D)">Export this day to Excel</button><button class="b" onclick="RT='daily';RD=D;rptJpg()">Download JPG (A4)</button></div>`;
 if(!ps.length)return $('#v').innerHTML=h+`<div class="empty">No ${FQ} stock products yet. Add them in the Products tab.</div></div>`;
 h+=`<div class="wrap"><table><tr><th>Product</th><th>Unit</th><th>Price</th><th>Opening</th><th>Added today</th><th>Closing</th><th>Used</th><th>Used value</th><th>Closing value</th></tr>`;
 for(const p of ps){
  const e=DB.entries.find(x=>x.pid==p.id&&x.date==D),pv=lastE(p.id,D);
  const op=e?e.open:(pv?pv.close:p.init);
  h+=`<tr data-id="${p.id}"><td>${esc(p.name)}<br><small class="u">${p.dept} / ${esc(p.section)}</small></td><td>${esc(p.unit)}</td><td>${f(p.price)}</td>
  <td><input type="number" step="any" min="0" class="o" value="${op}" oninput="calc()"></td>
  <td><input type="number" step="any" min="0" class="a" value="${e?e.add:0}" oninput="calc()"></td>
  <td><input type="number" step="any" min="0" class="c" value="${e?e.close:''}" placeholder="count" oninput="calc()"></td>
  <td class="u">-</td><td>-</td><td>-</td></tr>`}
 h+=`<tr class="t"><td colspan="6">Total</td><td></td><td id="tu">0</td><td id="tc">0</td></tr></table></div>
 <p class="hint">Opening comes from the last saved closing${FQ=='weekly'?' (previous weekly count)':''}. Enter what was added and what is left (closing). Used quantity and values are calculated for you.</p></div>`;
 $('#v').innerHTML=h;calc();
}
function calc(){
 let tu=0,tc=0;
 document.querySelectorAll('tr[data-id]').forEach(r=>{
  const p=DB.products.find(x=>x.id==r.dataset.id);
  const o=num(r.querySelector('.o').value)||0,a=num(r.querySelector('.a').value)||0,c=num(r.querySelector('.c').value);
  const td=r.children;
  if(isNaN(c)){td[6].textContent='-';td[7].textContent='-';td[8].textContent='-';return}
  const u=o+a-c;
  td[6].textContent=f(u);td[6].className=u<0?'lo':'u';
  td[7].textContent=f(u*p.price);td[8].textContent=f(c*p.price);
  if(u>=0)tu+=u*p.price;tc+=c*p.price;
 });
 $('#tu').textContent=f(tu);$('#tc').textContent=f(tc);
}
function saveDay(){
 let n=0,bad=0;
 document.querySelectorAll('tr[data-id]').forEach(r=>{
  const p=DB.products.find(x=>x.id==r.dataset.id);
  const o=num(r.querySelector('.o').value)||0,a=num(r.querySelector('.a').value)||0,c=num(r.querySelector('.c').value);
  if(isNaN(c))return;
  if(o+a-c<0){bad++;return}
  DB.entries=DB.entries.filter(e=>!(e.pid==p.id&&e.date==D));
  DB.entries.push({date:D,pid:p.id,fq:pfq(p),open:o,add:a,close:c,price:p.price,at:Date.now(),by:(ME&&ME.name)||''});DB.pending=DB.pending||[];const pk=D+'|'+p.id;if(!DB.pending.includes(pk))DB.pending.push(pk);n++;
 });
 persist();
 if(bad)toast(bad+' item(s) skipped: closing is more than opening + added');
 else toast(n?'Saved '+n+' item(s) for '+D:'Enter closing stock first');
}

/* ---------- PRODUCTS ---------- */
function products(){
 if(!isAdmin())return daily();
 const ps=act();
 let h=lowBox()+`<div class="card"><h2>Add new product</h2><div class="bar">
 <label>Name<input id="pn" placeholder="e.g. Basmati Rice"></label>
 <label>Unit<input id="pu" placeholder="kg / L / pcs" size="8"></label>
 <label>Location<select id="pl">${DB.locations.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
 <label>Section<select id="psx">${DB.sections.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
 <label>Stock type<select id="pf">${freqOpts().map(x=>`<option value="${x}">${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label>
 <label>Price per unit<input id="pp" type="number" step="any" min="0"></label>
 <label>Opening stock<input id="pi" type="number" step="any" min="0" value="0"></label>
 <label>Low-stock alert at<input id="pm" type="number" step="any" min="0" value="0"></label>
 <button class="b" onclick="addP()">Add product</button></div></div>
 ${dailyCard()}${storeCard()}${bulkCard()}
 <div class="card"><h2>Product list</h2><div class="bar">
 <label>Section<select id="pfs" onchange="PFS=this.value;pfilter()"><option value="all">All sections (${ps.length})</option>${DB.sections.map(x=>`<option value="${esc(x)}" ${PFS==x?'selected':''}>${esc(x)} (${ps.filter(p=>p.section==x).length})</option>`).join('')}</select></label>
 <label>Search<input id="pfq" value="${esc(PFQ)}" placeholder="type a product name" oninput="PFQ=this.value;pfilter()"></label>
 <button class="g" onclick="PFS='all';PFQ='';products()">Clear</button><span id="pfc" class="hint" style="align-self:center"></span></div>`;
 if(!ps.length)h+=`<div class="empty">Nothing here yet.</div>`;
 else{h+=`<div class="bar" style="margin:10px 0"><button class="g x" onclick="pkDel()">Delete selected</button><label>Change selected to<select id="pkf"><option value="">- Stock type -</option>${freqOpts().map(x=>`<option>${x}</option>`).join('')}</select></label><select id="pks"><option value="">- Section -</option>${DB.sections.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="pkl"><option value="">- Location -</option>${DB.locations.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="b" onclick="pkSet()">Apply to selected</button></div><div class="wrap"><table><tr><th><input type="checkbox" onclick="pkAll(this)"></th><th>Product</th><th>Location</th><th>Section</th><th>Stock</th><th>Unit</th><th>Price</th><th>Alert at</th><th>Current stock</th><th></th></tr>`;
 for(const p of ps){const e=lastE(p.id),q=e?e.close:p.init;
  h+=`<tr class="pr"><td><input type="checkbox" class="pk" value="${p.id}"></td><td><input style="width:170px;text-align:left" value="${esc(p.name)}" onchange="upd('${p.id}','name',this.value)"></td>
  ${sel(p.id,'dept',DB.locations,p.dept)}${sel(p.id,'section',DB.sections,p.section)}${sel(p.id,'freq',freqOpts(),pfq(p))}<td><input style="width:70px;text-align:left" value="${esc(p.unit)}" onchange="upd('${p.id}','unit',this.value)"></td>
  <td><input type="number" step="any" value="${p.price}" onchange="upd('${p.id}','price',+this.value)"></td>
  <td><input type="number" step="any" value="${p.min}" onchange="upd('${p.id}','min',+this.value)"></td>
  <td class="${p.min>0&&q<=p.min?'lo':'ok'}">${f(q)} ${esc(p.unit)}</td>
  <td><button class="g x" onclick="rmP('${p.id}')">Remove</button></td></tr>`}
 h+=`</table></div><p class="hint">Price changes apply from the next day you save. Past reports keep their old prices. Removed products keep their history in reports.</p>`}
 $('#v').innerHTML=h+'</div>';pfilter();
}
function addP(){
 const name=$('#pn').value.trim(),unit=$('#pu').value.trim()||'pcs',price=num($('#pp').value);
 if(!name||isNaN(price))return toast('Enter name and price');
 DB.products.push({id:nid(),name,unit,price,init:num($('#pi').value)||0,min:num($('#pm').value)||0,dept:$('#pl').value,section:$('#psx').value,freq:$('#pf').value,on:true});
 persist();toast(name+' added');products();
}
function upd(id,k,v){const p=DB.products.find(x=>x.id==id);if(k=='name'&&!v.trim())return products();p[k]=v;persist();toast('Updated');if(tab=='products')pfilter()}
var PFS='all',PFQ='';
function pfilter(){
 const q=PFQ.trim().toLowerCase();let n=0,t=0;
 document.querySelectorAll('tr.pr').forEach(r=>{t++;
  const name=r.querySelector('input:not(.pk)').value.toLowerCase(),sec=r.querySelectorAll('select')[1].value;
  const show=(PFS=='all'||sec==PFS)&&(!q||name.includes(q));r.style.display=show?'':'none';if(show)n++});
 const c=$('#pfc');if(c)c.textContent='Showing '+n+' of '+t}
const pkIds=()=>[...document.querySelectorAll('input.pk:checked')].map(i=>i.value);
function pkAll(c){document.querySelectorAll('tr.pr').forEach(r=>{if(r.style.display!='none')r.querySelector('input.pk').checked=c.checked})}
function pkDel(){const ids=pkIds();if(!ids.length)return toast('Tick the products first');
 if(!confirm('Remove '+ids.length+' selected products from the list?'))return;
 const del=confirm('Also delete ALL entries of these '+ids.length+' products (reports and Google Sheet)?\n\nOK = delete their entries too\nCancel = keep past entries in reports');
 ids.forEach(id=>{const p=DB.products.find(x=>x.id==id);if(!p)return;p.on=false;if(del){p.purged=true;DB.entries=DB.entries.filter(e=>e.pid!=id);DB.pending=(DB.pending||[]).filter(k=>!k.endsWith('|'+id));DB.purgePending=[...(DB.purgePending||[]),id]}});
 persist();toast(ids.length+' removed');products()}
function pkSet(){const ids=pkIds();if(!ids.length)return toast('Tick the products first');
 const a=$('#pkf').value,b=$('#pks').value,c=$('#pkl').value;if(!a&&!b&&!c)return toast('Choose what to change');
 ids.forEach(id=>{const p=DB.products.find(x=>x.id==id);if(a)p.freq=a;if(b)p.section=b;if(c)p.dept=c});persist();toast(ids.length+' updated');products()}
function rmP(id){const p=DB.products.find(x=>x.id==id);if(!confirm('Remove '+p.name+' from the product list?'))return;
 const del=confirm('Also delete ALL entries of '+p.name+' (reports and Google Sheet)?\n\nOK = delete its entries too\nCancel = keep past entries in reports');
 p.on=false;
 if(del){p.purged=true;DB.entries=DB.entries.filter(e=>e.pid!=id);DB.pending=(DB.pending||[]).filter(k=>!k.endsWith('|'+id));DB.purgePending=[...(DB.purgePending||[]),id]}
 persist();products()}

/* ---------- REPORTS ---------- */
function range(type,d){
 const x=pd(d);
 if(type=='daily')return[d,d];
 if(type=='custom')return d<=RE?[d,RE]:[RE,d];
 if(type=='weekly'){const k=(x.getDay()+6)%7,s=new Date(x);s.setDate(x.getDate()-k);const e=new Date(s);e.setDate(s.getDate()+6);return[ymd(s),ymd(e)]}
 return[ymd(new Date(x.getFullYear(),x.getMonth(),1)),ymd(new Date(x.getFullYear(),x.getMonth()+1,0))];
}
function build(type,d){
 const[a,b]=range(type,d),rows=[];let tu=0,tc=0;
 for(const p of DB.products){
  const es=DB.entries.filter(e=>e.pid==p.id&&e.date>=a&&e.date<=b).sort((x,y)=>x.date<y.date?-1:1);
  if(!es.length||!ok(p))continue;
  const open=es[0].open,add=es.reduce((s,e)=>s+e.add,0),used=es.reduce((s,e)=>s+(e.open+e.add-e.close),0);
  const uv=es.reduce((s,e)=>s+(e.open+e.add-e.close)*e.price,0),L=es[es.length-1],cv=L.close*L.price;
  tu+=uv;tc+=cv;
  rows.push([p.name,p.dept,p.section,p.unit,open,add,used,L.close,L.price,uv,cv,(p.min>0&&L.close<=p.min)?'LOW':'OK']);
 }
 return{a,b,rows,tu,tc};
}
const HEAD=['Product','Location','Section','Unit','Opening','Added','Used','Closing','Price','Used value','Closing value','Status'];
function report(){
 const r=build(RT,RD);
 let h=lowBox()+`<div class="card"><div class="bar">
 ${filt('report')}<label>Stock<select onchange="FQ=this.value;report()"><option value="daily" ${FQ=='daily'?'selected':''}>Daily stock</option><option value="weekly" ${FQ=='weekly'?'selected':''}>Weekly stock</option>${isStoreBr()?`<option value="store" ${FQ=='store'?'selected':''}>Store stock</option>`:''}<option value="all" ${FQ=='all'?'selected':''}>All</option></select></label><label>Report type<select onchange="RT=this.value;report()">${['daily','weekly','monthly','custom'].map(t=>`<option value="${t}" ${t==RT?'selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></label>
 <label>${RT=='custom'?'From date':RT=='daily'?'Date':'Any date in the period'}<input type="date" value="${RD}" onchange="RD=this.value;report()"></label>
 ${RT=='custom'?`<label>To date<input type="date" value="${RE}" onchange="RE=this.value;report()"></label>`:''}
 <button class="b" onclick="exportReport(RT,RD)">Export to Excel</button><button class="g" onclick="window.print()">Print</button><button class="b" onclick="rptJpg()">Download JPG (A4)</button></div>
 <h2>${r.a==r.b?r.a:r.a+' to '+r.b}</h2>`;
 if(!r.rows.length)return $('#v').innerHTML=h+`<div class="empty">No entries saved for this period.</div></div>`;
 h+=`<div class="wrap"><table><tr>${HEAD.map(x=>`<th>${x}</th>`).join('')}</tr>`;
 for(const x of r.rows)h+=`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td>${[4,5,6,7,8,9,10].map(i=>`<td>${f(x[i])}</td>`).join('')}<td class="${x[11]=='LOW'?'lo':'ok'}">${x[11]}</td></tr>`;
 h+=`<tr class="t"><td colspan="9">Total value</td><td>${f(r.tu)}</td><td>${f(r.tc)}</td><td></td></tr></table></div></div>`;
 $('#v').innerHTML=h;
}
async function rptJpg(){

 const W=1588,H=2246,M=70,RH=46,TOP=300,BOT=110,FN='Arial,"Noto Sans Bengali",sans-serif';
 const C=[['Product',.30,'l'],['Section',.12,'l'],['Unit',.06,'l'],['Opening',.08,'r'],['Added',.08,'r'],['Used',.08,'r'],['Closing',.08,'r'],['Used value',.10,'r'],['Closing value',.10,'r']];
 const TW=W-2*M,X=[],CW=C.map(c=>c[1]*TW);let ax=M;CW.forEach(w=>{X.push(ax);ax+=w});
 const lg=new Image();await new Promise(ok=>{lg.onload=ok;lg.onerror=ok;lg.src=DB.logo||DEF});
 const kind={daily:'Daily Stock',weekly:'Weekly Stock',store:'Store Stock',all:'Stock'}[FQ]||'Stock',per=r.a==r.b?r.a:r.a+' to '+r.b;

 const pp=Math.floor((H-TOP-BOT)/RH)-1,n=Math.ceil(body.length/pp);
 const fit=(cx,t,w)=>{t=String(t);if(cx.measureText(t).width<=w)return t;while(t.length>1&&cx.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
 for(let p=0;p<n;p++){
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
  cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.textBaseline='middle';cx.fillStyle='#000';
  const lw=lg.naturalWidth?Math.round(130*lg.naturalWidth/lg.naturalHeight):0;if(lw)cx.drawImage(lg,W-M-lw,55,lw,130);
  cx.textAlign='center';cx.font='bold 64px Georgia,serif';cx.fillText('BURGEROLOGY',W/2,115);
  cx.font='bold 36px '+FN;cx.fillText(kind+' Report',W/2,185);cx.font='28px '+FN;cx.fillText(BR+'  |  '+per,W/2,235);
  let y=TOP-RH;cx.fillStyle='#111';cx.fillRect(M,y,TW,RH);cx.fillStyle='#F5C518';cx.font='bold 25px '+FN;
  C.forEach((c,i)=>{cx.textAlign=c[2]=='r'?'right':'left';cx.fillText(c[0],c[2]=='r'?X[i]+CW[i]-10:X[i]+10,y+RH/2)});
  body.slice(p*pp,(p+1)*pp).forEach((row,k)=>{y=TOP+k*RH;const tot=row[0]=='TOTAL'&&p*pp+k==body.length-1;
   cx.fillStyle=tot?'#FFE27A':k%2?'#F2F2F2':'#fff';cx.fillRect(M,y,TW,RH);cx.fillStyle='#000';cx.font=(tot?'bold ':'')+'25px '+FN;
   row.forEach((v,i)=>{cx.textAlign=C[i][2]=='r'?'right':'left';cx.fillText(fit(cx,v,CW[i]-20),C[i][2]=='r'?X[i]+CW[i]-10:X[i]+10,y+RH/2)})});
  const yb=TOP+Math.min(pp,body.length-p*pp)*RH;cx.strokeStyle='#000';cx.lineWidth=2;cx.strokeRect(M,TOP-RH,TW,yb-TOP+RH);
  cx.fillStyle='#555';cx.font='24px '+FN;cx.textAlign='center';cx.fillText('Page '+(p+1)+' of '+n+'  |  Printed '+ymd(new Date()),W/2,H-55);
  await new Promise(ok=>cv.toBlob(b=>{const an=document.createElement('a');an.href=URL.createObjectURL(b);an.download='Burgerology_'+kind.replace(/ /g,'_')+'_'+r.a+'_p'+(p+1)+'.jpg';document.body.appendChild(an);an.click();an.remove();setTimeout(()=>URL.revokeObjectURL(an.href),4000);ok()},'image/jpeg',.92));
  await new Promise(ok=>setTimeout(ok,500))}
 toast(n+' JPG page(s) downloaded (allow multiple downloads if asked)')}
function exportReport(type,d){
 const r=build(type,d);
 if(!r.rows.length)return toast('No entries to export');
 const t=(c,v,s='')=>`<${c} style="${s}">${esc(v)}</${c}>`;
 let x=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1">
 <tr>${t('td','Burgerology - Stock Report ('+type+'): '+r.a+(r.a==r.b?'':' to '+r.b),'font-weight:bold;font-size:14pt')}</tr>
 <tr>${HEAD.map(h=>t('th',h,'background:#FFC400;font-weight:bold')).join('')}</tr>`;
 for(const w of r.rows)x+=`<tr>${w.map((v,i)=>i<4||i==11?t('td',v):`<td x:num="${v}">${Math.round(v*100)/100}</td>`).join('')}</tr>`;
 x+=`<tr><td colspan="9"><b>Total value</b></td><td><b>${Math.round(r.tu*100)/100}</b></td><td><b>${Math.round(r.tc*100)/100}</b></td><td></td></tr></table></body></html>`;
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([x],{type:'application/vnd.ms-excel'}));
 a.download=`Stock_${type}_${r.a}.xls`;document.body.appendChild(a);a.click();a.remove();
 toast('Excel file downloaded');
}

function listCard(kind,title,one){return `<div class="card"><h2>${title}</h2><div class="chips">${DB[kind].map((x,i)=>`<span class="chip">${esc(x)}<button title="Delete" onclick="delItem('${kind}',${i})">&times;</button></span>`).join('')}</div>

function saveLists(){persist()}
async function addItem(kind){const v=$('#n_'+kind).value.trim();if(!v)return;
 if(DB[kind].some(x=>x.toLowerCase()==v.toLowerCase()))return toast('"'+v+'" already exists');
 DB[kind].push(v);await saveLists();toast('Added');settings()}
async function delItem(kind,i){const name=DB[kind][i],key=kind=='locations'?'dept':'section';
 const n=act().filter(p=>p[key]==name).length;
 if(n)return toast(n+' product(s) still use "'+name+'". Change them in Products first.');
 if(DB[kind].length<2)return toast('Keep at least one');
 if(!confirm('Delete "'+name+'"?'))return;
 DB[kind].splice(i,1);await saveLists();toast('Deleted');settings()}

function settings(){
 if(!isAdmin())return daily();
 $('#v').innerHTML=`${isTop()?`<div class="card"><h2>Branch logo</h2><div class="bar"><label>Choose logo image (PNG / JPG)<input type="file" accept="image/*" onchange="setLogo(this.files[0])"></label></div></div><div class="card"><h2>Products &amp; sections</h2><p class="hint">1) Import the backup file (.json) from the old app into this branch. Only products, sections and locations are taken (not stock entries).<br>2) Then copy this branch's list to all other branches.</p><div class="bar"><label>Old app backup file<input type="file" accept=".json,application/json" onchange="importOld(this.files[0])"></label><button class="b" onclick="copyAll()">Copy products &amp; sections to ALL branches</button></div></div>`:''}${listCard('locations','Locations','location')}${listCard('sections','Sections','section')}<div class="card" id="ucard"><h2>Users</h2><p class="hint">Loading...</p></div>`;loadUsers()}
function setLogo(file){
 if(!file)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/im.height),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);DB.logo=c.toDataURL('image/png');persist();applyLogo();toast('Logo saved')};im.src=r.result};

 if(!file)return;const r=new FileReader();

/* ---------- LOGIN AND USERS ---------- */
let ME=null;
const isAdmin=()=>ME&&ME.role!='staff';const isTop=()=>ME&&ME.role=='admin';
async function H(p){const t='bgy|'+p;try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
function loadBr(b){BR=b;K='bgy_v2_'+b;let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}DB=norm(d||{});DB.syncUrl=API}
function authView(){
 $('#auth').innerHTML=`<form id="af" novalidate><img src="${DB.logo||DEF}" alt=""><p class="hint" style="text-align:center;margin:0">Log in to continue.</p><label>Username<input id="au" autocomplete="off"></label><label>Password<input id="ap" type="password"></label><button class="b">Log in</button><div class="lo" id="ae"></div></form>`;
 $('#af').addEventListener('submit',doAuth);$('#auth').hidden=false;$('#who').innerHTML='';$('#nav').innerHTML='';$('#v').innerHTML='';setTimeout(()=>$('#au').focus(),50)}
async function doAuth(e){e.preventDefault();const er=$('#ae');er.textContent='Please wait...';
 try{const j=await post({act:'login',u:$('#au').value.trim(),p:$('#ap').value});
  if(j.error){er.textContent=j.error;return false}
  if(!j.branches.length){er.textContent='No branch is set up yet';return false}
  TOK=j.token;ME={name:j.user,role:j.role,branches:j.branches};
  try{sessionStorage.setItem('bgy_s',JSON.stringify({t:TOK,m:ME}))}catch(x){}
  $('#auth').hidden=true;enter(j.branches[0])}catch(x){er.textContent='Error: '+(x.message||x)}return false}
function enter(b){
 loadBr(b);applyLogo();
 $('#who').innerHTML=' &nbsp;|&nbsp; '+esc(ME.name)+' ('+ME.role+') &nbsp;|&nbsp; '+(ME.branches.length>1?`<select onchange="enter(this.value)">${ME.branches.map(x=>`<option ${x==b?'selected':''}>${esc(x)}</option>`).join('')}</select>`:esc(b))+' &nbsp;|&nbsp; <a href="#" style="color:#000" onclick="logout();return false">Log out</a>';
 const first=!ENTERED;ENTERED=1;go(first&&isTop()?'all':(tab=='all'||(tab=='store'&&!isStoreBr())?'daily':tab));sync(true)}
function logout(){TOK='';ME=null;ENTERED=0;try{sessionStorage.removeItem('bgy_s')}catch(e){}authView()}
function salesLocked(){return !!ME&&ME.role!='admin'&&SDT!=ymd(new Date())}
function salesLock(){if(!salesLocked())return;document.querySelectorAll('#rpt input').forEach(i=>i.readOnly=true);toast('Past days are locked for managers')}
async function allView(){
 if(!isTop())return daily();
 $('#v').innerHTML='<div class="card"><h2>All Branches</h2><p class="hint">Loading...</p></div>';
 try{const j=await post({act:'dash'});if(j.error)throw new Error(j.error);
  const mo=ymd(new Date()).slice(0,7),td=ymd(new Date());
  const rows=Object.keys(j.dash).map(b=>{const r=j.dash[b],m=r.filter(x=>String(x[0]).startsWith(mo)),t=i=>m.reduce((a,x)=>a+(+x[i]||0),0),T=r.find(x=>String(x[0])==td);
   return `<tr style="cursor:pointer" onclick="enter('${esc(b)}')"><td>${esc(b)}</td><td>${T?f(T[1]):'-'}</td><td>${m.length}</td><td>${f(t(1))}</td><td>${f(t(5))}</td><td>${pct(t(5),t(1))}</td><td>${pct(t(3),t(1))}</td><td>${f(t(11))}</td><td>${f(t(12))}</td></tr>`}).join('');
  $('#v').innerHTML=`<div class="card"><h2>All Branches &middot; ${mo}</h2><div class="wrap"><table><tr><th>Branch</th><th>Today sale</th><th>Days</th><th>Month sale</th><th>Month cost</th><th>Cost %</th><th>Food %</th><th>Extra</th><th>Deposit</th></tr>${rows}</table></div><p class="hint">Click a branch to open it.</p></div>`
 }catch(e){$('#v').innerHTML='<div class="card"><div class="alert">'+esc(e.message)+'</div></div>'}}

function importOld(file){
 if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products))throw 0;
  if(DB.products.length&&!confirm('This branch already has '+DB.products.length+' products. Replace products, sections and locations with the file?'))return;
  DB.products=d.products;if(d.sections&&d.sections.length)DB.sections=d.sections;if(d.locations&&d.locations.length)DB.locations=d.locations;
  norm(DB);DB.metaAt=Date.now();DB.metaHash='';DB.metaDirty=1;persist();toast(d.products.length+' products imported');sync(true)}catch(e){toast('This is not a valid backup file')}};
 r.readAsText(file)}
async function copyAll(){
 if(!DB.products.length)return toast('Add or import products in this branch first');
 if(!confirm('Replace products, sections and locations of ALL other branches with this branch list? Stock entries and sales are not touched.'))return;
 try{await sync();const j=await post({act:'copymeta'});if(j.error)return toast(j.error);toast('Copied to '+j.copied+' other branch(es)')}catch(e){toast(e.message)}}
async function loadUsers(op,x){
 try{const j=await post({act:'users',op,...x});if(j.error)return toast(j.error);const c=$('#ucard');if(!c)return;

  <div class="bar" style="margin-top:14px"><label>Username<input id="un"></label><label>Password (min 4)<input id="up" type="password"></label><label>Role<select id="ur">${isTop()?'<option value="manager">Manager</option><option value="staff">Staff</option><option value="admin">Admin</option>':'<option value="staff">Staff</option>'}</select></label>${isTop()?`<label>Branch<select id="ub">${ME.branches.map(b=>`<option>${esc(b)}</option>`).join('')}</select></label>`:''}<button class="b" onclick="uAdd()">Add user</button></div>`
 }catch(e){toast(e.message)}}
function uAdd(){loadUsers('add',{name:$('#un').value.trim(),pw:$('#up').value,role:$('#ur').value,branch:$('#ub')?$('#ub').value:''})}
function uPw(n){const p=prompt('New password for '+n+' (min 4 characters)');if(p)loadUsers('pw',{name:n,pw:p})}

/* ---------- SAVE WITH DATA / OPEN FILE WITH DATA ---------- */
const hdb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bgy_handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function hGet(){try{const d=await hdb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get('file');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function hSet(h){try{const d=await hdb();await new Promise(res=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(h,'file');t.oncomplete=res;t.onerror=res})}catch(e){}}
function buildOut(){
 const json=JSON.stringify(DB).replace(/</g,'\\u003c');
 return TEMPLATE.replace(new RegExp('<script id="seed" type="application/json">[\\s\\S]*?<\\/script>'),()=>'<script id="seed" type="application/json">'+json+'<'+'/script>');
}
function downloadCopy(out){
 const d=new Date(),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));
 a.download='Burgerology_'+ymd(d)+'_'+pad(d.getHours())+pad(d.getMinutes())+'.html';
 document.body.appendChild(a);a.click();a.remove();
 toast('Downloaded a new copy with all data. Copy it to the other device.');
}
async function saveWithData(asNew){
 DB.lastBackup=Date.now();persist();
 const out=buildOut();
 if(!window.showSaveFilePicker)return downloadCopy(out);
 try{
  let h=asNew===true?null:await hGet();
  if(h){
   let p=await h.queryPermission({mode:'readwrite'});
   if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});
   if(p!=='granted')h=null;
  }
  if(!h){
   h=await showSaveFilePicker({suggestedName:'Burgerology.html',types:[{description:'HTML file',accept:{'text/html':['.html']}}]});
   await hSet(h);
  }
  const w=await h.createWritable();await w.write(new Blob([out],{type:'text/html'}));await w.close();
  toast('Saved in the same file: '+h.name);
 }catch(e){
  if(e&&e.name==='AbortError')return;
  downloadCopy(out);
 }
}
function norm(d){d.sales=d.sales||{};d.slabels=d.slabels||{};d.products=d.products||[];d.entries=d.entries||[];d.users=d.users||[];
 d.sections=d.sections&&d.sections.length?d.sections:['Raw','Bonton','Horof'];d.locations=d.locations&&d.locations.length?d.locations:['Front','Kitchen'];
 d.products.forEach(p=>{p.dept=p.dept||'Kitchen';p.section=p.section||d.sections[0];p.freq=p.freq||'weekly'});return d}
const nonEmpty=d=>d&&(d.products.length||d.entries.length||d.users.length);
const fmtT=t=>t?new Date(t).toLocaleString():'unknown time';
const cnt=d=>d.products.length+' products, '+d.entries.length+' entries';
function mergeDB(a,b){
 const bNew=(b.savedAt||0)>(a.savedAt||0),m={...a};
 const pm=new Map(a.products.map(p=>[String(p.id),p]));
 b.products.forEach(p=>{const k=String(p.id);if(!pm.has(k)||bNew)pm.set(k,p)});
 m.products=[...pm.values()];
 const em=new Map(a.entries.map(e=>[e.date+'|'+e.pid,e])),conf=[];
 b.entries.forEach(e=>{const k=e.date+'|'+e.pid,x=em.get(k);
  if(!x)em.set(k,e);else if(x.open!=e.open||x.add!=e.add||x.close!=e.close)conf.push([k,e])});
 if(conf.length&&confirm(conf.length+" entries exist on both sides with different numbers.\n\nOK = use the file's numbers\nCancel = keep this computer's numbers"))conf.forEach(([k,e])=>em.set(k,e));
 m.entries=[...em.values()];
 const un=new Set(a.users.map(u=>u.name.toLowerCase()));
 m.users=[...a.users,...b.users.filter(u=>!un.has(u.name.toLowerCase()))];
 m.sections=[...new Set([...a.sections,...b.sections])];m.locations=[...new Set([...a.locations,...b.locations])];
 m.slabels=bNew?{...(a.slabels||{}),...(b.slabels||{})}:{...(b.slabels||{}),...(a.slabels||{})};m.sales=bNew?{...(a.sales||{}),...(b.sales||{})}:{...(b.sales||{}),...(a.sales||{})};m.logo=(bNew&&b.logo)?b.logo:(a.logo||b.logo);m.lastBackup=Math.max(a.lastBackup||0,b.lastBackup||0);
 return m}

const mh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h};

async function post(b){
 if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(API))throw new Error('Set the API link at the top of the HTML file');
 const r=await fetch(API,{method:'POST',body:JSON.stringify({...b,token:TOK,branch:BR})});const t=await r.text();let j;
 try{j=JSON.parse(t)}catch(e){throw new Error('Server returned a web page. Redeploy the Web App (Who has access = Anyone).')}
 if(j.error=='auth'){logout();throw new Error('Session expired. Log in again.')}
 return j}
function since0(){return(DB.syncInit&&DB.lastSync)?ymd(new Date(DB.lastSync-7*864e5)):''}
function applyMeta(g){const m=g.meta;DB.products=m.products||[];DB.sections=m.sections&&m.sections.length?m.sections:DB.sections;DB.locations=m.locations&&m.locations.length?m.locations:DB.locations;DB.scfg=m.scfg||DB.scfg||{};DB.sitems=m.sitems||DB.sitems||[];DB.sov=m.sov||DB.sov||{};DB.slabels=m.slabels||DB.slabels||{};DB.logo=m.logo||'';

async function sync(manual){
 if(!DB.syncUrl||SYN||!TOK||!ME)return;
 DB.pending=DB.pending||[];
 if(!navigator.onLine){synSt('\u23f3 '+DB.pending.length+' waiting (offline)');if(manual)toast('No internet');return}
 SYN=true;let changed=false;
 try{
  if(!DB.syncInit){DB.entries.forEach(e=>{e.at=e.at||1});DB.pending=DB.entries.map(e=>e.date+'|'+e.pid)}
  let sendMeta=ME.role!='staff'&&!!DB.products.length;
  if(!DB.metaAt){
   const g=await post({});
   if(g.meta){applyMeta(g);sendMeta=false;changed=true}
   else if(sendMeta){DB.metaHash=metaHash();DB.metaAt=Date.now();DB.metaDirty=1}
  }else if(sendMeta){const h=metaHash();if(h!==DB.metaHash){DB.metaHash=h;DB.metaAt=Date.now();DB.metaDirty=1}else if(!DB.metaDirty)sendMeta=false}
  const m1=new Map(DB.entries.map(e=>[e.date+'|'+e.pid,e])),sentAt={};
  const purged=new Set(DB.products.filter(p=>p.purged).map(p=>String(p.id))),purge=[...(DB.purgePending||[])];
  const sent=DB.pending.map(k=>m1.get(k)).filter(e=>e&&!purged.has(String(e.pid))).map(e=>{sentAt[e.date+'|'+e.pid]=e.at;return{...e,name:(DB.products.find(p=>p.id==e.pid)||{}).name||''}});
  if(DB.rv!==3){DB.salesPending=Object.keys(DB.sales).filter(k=>/^\d{4}-/.test(k));DB.rv=3}
  const sd=[...(DB.salesPending||[])].slice(0,10),srows=sd.filter(d=>DB.sales[d]).map(d=>({date:d,...sVals(DB.sales[d]),S:DB.sales[d],cfg:{f:nF(DB.sales[d]),o:nO(DB.sales[d]),s:nS(DB.sales[d])}}));
  const lb=k=>String((DB.slabels||{})['l_'+k]||'').replace(/\s*\(-\)\s*=?\s*$|\s*=\s*$/,'').trim(),labels={pat:lb('pat'),fp:lb('fp'),hn:lb('hn'),bk:lb('bk')};
  const g=await post({entries:sent,purge,sales:srows,labels,lab:srows.length?(DB.slabels||{}):undefined,logo:srows.length?(DB.logo||DEF):undefined,meta:sendMeta?metaObj():undefined,metaAt:DB.metaAt||0,since:since0()});
  if(g.error)throw new Error(g.error);
  const m2=new Map(DB.entries.map(e=>[e.date+'|'+e.pid,e]));
  DB.pending=DB.pending.filter(k=>{const e=m2.get(k);return e&&(!(k in sentAt)||e.at!==sentAt[k])});
  Object.entries(g.sales||{}).forEach(([k,v])=>{const o=DB.sales[k];if(!o||(v._t||0)>(o._t||0)){DB.sales[k]=v;changed=true}});
  (g.entries||[]).forEach(e=>{const k=e.date+'|'+e.pid,l=m2.get(k);if(!l||(l.at||0)<(e.at||0)){m2.set(k,e);changed=true}});
  DB.purgePending=(DB.purgePending||[]).filter(x=>!purge.includes(x));DB.salesPending=(DB.salesPending||[]).filter(d=>!sd.includes(d));if(DB.salesPending.length)setTimeout(()=>sync(),1500);
  DB.entries=[...m2.values()];
  if(g.meta&&g.metaAt>(DB.metaAt||0)){applyMeta(g);changed=true}
  {const pg=new Set(DB.products.filter(p=>p.purged).map(p=>String(p.id)));const n0=DB.entries.length;DB.entries=DB.entries.filter(e=>!pg.has(String(e.pid)));if(DB.entries.length!=n0)changed=true}
  if(sendMeta)DB.metaDirty=0;DB.syncInit=1;DB.lastSync=Date.now();DB.lastErr='';persist();
  synSt(DB.pending.length?'\u23f3 '+DB.pending.length+' waiting':'\u2713 synced');
  if(manual)toast('Sync done');
  if(changed){if(ME&&(manual||tab!='daily'))go(tab);else if(!ME)authView()}
 }catch(e){DB.lastErr=String(e.message||e);try{persist()}catch(x){}synSt('\u26a0 '+DB.pending.length+' waiting');if(manual)alert('Sync failed:\n\n'+DB.lastErr)}
 finally{SYN=false}
}

function sNav(n){const d=pd(SDT);d.setDate(d.getDate()+n);SDT=ymd(d);sales()}
function sPrevCC(){const ds=Object.keys(DB.sales).filter(d=>d<SDT&&String(DB.sales[d].cc??'').trim()!=='').sort();return ds.length?parseFloat(String(DB.sales[ds[ds.length-1]].cc).replace(/,/g,''))||0:0}
function sOpen(){const v=sPrevCC();if(!v)return toast('No earlier Cash Closing found');const i=$('#rpt input[data-k="op"]');if(!i)return toast('Opening is not in the list');i.value=f(v);sSet(i);toast('Opening = '+f(v))}
function sSet(el){if(salesLocked())return;
 if(!DB.sales[SDT])DB.sales[SDT]={...SDEF};
 DB.sales[SDT][el.dataset.k]=el.value;DB.sales[SDT]._t=Date.now();DB.salesPending=DB.salesPending||[];if(!DB.salesPending.includes(SDT))DB.salesPending.push(SDT);sCalc();
 clearTimeout(SPT);SPT=setTimeout(persist,700)}
function sFmt(el){const t=el.value.replace(/,/g,'').trim();if(t!==''&&!isNaN(+t)){el.value=f(+t);sSet(el)}}
async function sImg(type){
 try{
  const r=$('#rpt'),c=r.cloneNode(true),w=r.offsetWidth,h=r.offsetHeight;
  c.querySelectorAll('input').forEach(i=>{const sp=document.createElement('span');sp.textContent=i.value;sp.className=i.className;sp.style.cssText=i.style.cssText;i.replaceWith(sp)});
  c.style.width=w+'px';
  const css=[...document.styleSheets].flatMap(x=>[...x.cssRules]).filter(x=>x.cssText.includes('#rpt')&&!x.cssText.startsWith('@media')&&!x.cssText.startsWith('@page')).map(x=>x.cssText).join('\n');
  const xml=new XMLSerializer().serializeToString(c);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="background:#fff;font:15px/1.5 Georgia,serif"><style>*{box-sizing:border-box}${css}</style>${xml}</div></foreignObject></svg>`;
  const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  const k=3,cv=document.createElement('canvas');cv.width=w*k;cv.height=h*k;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
  const blob=await new Promise(ok=>cv.toBlob(ok,'image/'+type,.95));
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Burgerology_Sales_'+SDT+(type=='png'?'.png':'.jpg');document.body.appendChild(a);a.click();a.remove();toast('Saved '+a.download)
 }catch(e){toast('Image could not be made here. Use Print > Save as PDF.')}}
function sSave(){clearTimeout(SPT);persist();toast('Saved '+SDT)}
function sPrint(){sSave();document.body.classList.add('sp');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('sp'),500)},100)}
function sFood(){
 let t=0;DB.entries.filter(e=>e.date==SDT&&pfq(DB.products.find(p=>p.id==e.pid)||{})=='daily').forEach(e=>{const u=e.open+e.add-e.close;if(u>0)t+=u*(e.price||0)});
 if(!t)return toast('No stock usage value for this date');
 const r=[...document.querySelectorAll('#rpt input[data-k^="fn"]')].find(i=>!i.value&&!$('#rpt input[data-k="fa'+i.dataset.k.slice(2)+'"]').value);
 if(!r)return toast('Food cost rows are full');
 const a=$('#rpt input[data-k="fa'+r.dataset.k.slice(2)+'"]');r.value='Stock usage';sSet(r);a.value=f(Math.round(t*100)/100);sSet(a);toast('Added stock usage '+f(t))}
function boot(){let x=null;try{x=JSON.parse(sessionStorage.getItem('bgy_s'))}catch(e){}
 if(x&&x.t&&x.m){TOK=x.t;ME=x.m;$('#auth').hidden=true;enter(ME.branches[0])}else authView()}
boot();
setTimeout(()=>sync(),1000);setInterval(()=>sync(),60000);addEventListener('online',()=>sync());
